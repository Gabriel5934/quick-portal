# Local development. Included by the root docker-compose.yml (`make dev`).
# Quick API is served at http://localhost:8100 (interactive docs at /docs).
services:
  quick-api:
    build: .
    restart: unless-stopped
    env_file:
      # The untracked root .env.portal holds JWT_SECRET and the CIELO_*
      # settings; the root Makefile generates it (with a random JWT_SECRET)
      # when missing. Without them the app refuses to start. The path is
      # relative to this file. The other settings are set under environment
      # below.
      - path: ../.env.portal
        required: false
    environment:
      ACCESS_TOKEN_TTL_SECONDS: "300"
      REFRESH_TOKEN_TTL_SECONDS: "86400"
      # Relative to the working directory /app, so the database lives in the
      # ./data bind mount below.
      DATABASE_PATH: data/quick-api.sqlite3
      # Serves /docs, /redoc and /openapi.json in development only.
      API_DOCS_ENABLED: "true"
    # Single process; --reload restarts it when ./app or ./alembic change.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8100:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./alembic:/app/alembic

  # Tests and lint in a container (`make test-api`). Behind the `test`
  # profile, so `make dev` and a plain `up` never start it. The tests build
  # their own settings, so no env_file; the database lives in a tmpfs, never
  # in the ./data volume above.
  quick-api-test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      ACCESS_TOKEN_TTL_SECONDS: "300"
      REFRESH_TOKEN_TTL_SECONDS: "86400"
      DATABASE_PATH: /tmp/quick-api-test/quick-api.sqlite3
      API_DOCS_ENABLED: "true"
    tmpfs:
      - /tmp
