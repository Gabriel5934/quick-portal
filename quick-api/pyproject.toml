# Dependencies are pinned in requirements.txt (runtime) and
# requirements-dev.txt (tests and lint). This file only configures tools.
[project]
name = "quick-api"
version = "0.1.0"
description = "Quick Portal API: auth and business endpoints."
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# ./alembic holds migrations; the import is the third-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
