# Build environments (sandbox and production): Quick API on the compose network
# only, with no port published on the host. quick-portal/docker-compose.yml
# includes this file and puts Caddy in front of Quick Portal, whose server
# functions call Quick API at http://quick-api:8000.
# Requires quick-api/.env (see .env.example).
services:
  quick-api:
    build: .
    restart: unless-stopped
    env_file:
      # Optional file, but JWT_SECRET below is required: compose (including
      # `docker compose config`) fails when it is missing or empty in both the
      # shell and quick-api/.env.
      - path: .env
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in quick-api/.env}
    # The image's CMD runs migrations, then uvicorn with exactly one worker.
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
