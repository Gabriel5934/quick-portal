services:
  app:
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      secrets:
        - sentry_auth_token
    ports:
      - "80:80"
    restart: unless-stopped

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
