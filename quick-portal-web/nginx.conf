server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Used by Docker's health check without producing access-log noise.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed asset names, so these files can be cached
    # indefinitely. Missing assets must return 404 rather than the SPA shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # TanStack Router handles routes in the browser. Falling back to index.html
    # keeps direct navigation and refreshes on nested routes working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell should be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;
}
