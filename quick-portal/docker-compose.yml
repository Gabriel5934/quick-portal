# Build environments (sandbox and production): Quick Portal behind Caddy, which
# serves PORTAL_HOST (set on the caddy service below) over HTTPS on port 443 and
# redirects HTTP to HTTPS.
# Includes Quick API's build compose, so one command starts the whole stack on
# a single compose network. Quick API is internal only: nothing publishes its
# port, and only the portal's server functions call it.
# Requires the untracked root .env.portal (keys listed in
# quick-api/.env.example).
#   docker compose -f quick-portal/docker-compose.yml up --build --detach
# Not included by the root docker-compose.yml (local development).

# Explicit, so it never shares containers or volumes with the root development
# project, which is also named quick-portal.
name: quick-portal-deploy

include:
  # Quick API's compose interpolates ${JWT_SECRET}. Without env_file here it
  # would read quick-api/.env (the included file's own directory), so point it
  # at the root .env.portal, which also feeds the service's env_file. Relative
  # to this file.
  - path: ../quick-api/docker-compose.yml
    env_file: ../.env.portal

services:
  portal:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      # Server functions call Quick API over the compose network; the browser
      # never talks to Quick API directly.
      QUICK_API_URL: http://quick-api:8000
    depends_on:
      - quick-api
    expose:
      - "3000"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Runs as non-root. Caddy writes only to /data/caddy and /config/caddy,
    # which the image creates world-writable, so fresh volumes just work.
    # Volumes created while Caddy ran as root need a one-time chown first:
    #   docker compose -f quick-portal/docker-compose.yml run --rm --no-deps \
    #     --user 0 --entrypoint chown caddy -R 1000:1000 /data/caddy /config/caddy
    user: "1000:1000"
    # Lets the non-root process bind ports 80 and 443 (Docker's default for
    # bridge networks, set explicitly so it does not depend on the runtime).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      - portal
    environment:
      # Public hostname the Caddyfile serves over HTTPS.
      PORTAL_HOST: quick-portal-sandbox.duckdns.org
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Certificates and ACME account; must persist across restarts.
  caddy_data:
  caddy_config:
