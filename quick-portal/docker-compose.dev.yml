# Local development. Included by the root docker-compose.yml (`make dev`).
# Quick Portal is served at http://localhost:3000.
services:
  portal:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      # Server functions call Quick API over the compose network; the browser
      # never talks to Quick API directly.
      QUICK_API_URL: http://quick-api:8000
    depends_on:
      - quick-api
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Keeps the Linux node_modules from the image instead of the host's.
      - /app/node_modules
