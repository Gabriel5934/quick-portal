# Local development. Included by the root docker-compose.yml (`make dev`).
# Quick Portal is served at http://localhost:3000 and Storybook at
# http://localhost:6006.
services:
  portal:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      # Server functions call Quick API over the compose network; the browser
      # never talks to Quick API directly.
      QUICK_API_URL: http://quick-api:8000
    depends_on:
      - quick-api
    # The node_modules volume outlives image rebuilds, so install on every start
    # to pick up dependency changes in package-lock.json.
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Keeps the Linux node_modules from the image instead of the host's.
      - /app/node_modules

  storybook:
    build:
      context: .
      target: dev
    restart: unless-stopped
    # Stories use fixtures and .storybook/mocks, so Storybook needs no backend.
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund && npm run storybook -- --host 0.0.0.0 --ci --no-open",
      ]
    ports:
      - "6006:6006"
    volumes:
      - ./:/app
      - /app/node_modules
