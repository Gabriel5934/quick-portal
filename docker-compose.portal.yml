# Production: Quick Portal behind Caddy and Quick API on one compose network.
# Only Caddy publishes ports; Quick API is internal. Quick API's Cielo settings
# in the untracked root .env.portal must point at a Cielo API reachable from
# this stack: the mock Cielo API (cielo-mock) is not part of it.
# Requires .env.portal (keys listed in quick-api/.env.example).
#   docker compose -f docker-compose.portal.yml up --build --detach
# Not included by the root docker-compose.yml (local development).

# Same project as quick-portal/docker-compose.yml, so Caddy keeps its
# certificates; never the root development project's name.
name: quick-portal-deploy

include:
  # Portal and Caddy; includes Quick API's build compose in turn.
  - ./quick-portal/docker-compose.yml
