# Build environments (sandbox and production): Beacon behind Caddy, which
# serves API_HOST over HTTPS on port 443 and redirects HTTP to HTTPS.
# Requires beacon/.env (see .env.example).
services:
  beacon:
    build: .
    restart: unless-stopped
    env_file:
      # Not marked required so `docker compose config` works without secrets.
      # Without CIELO_WEBHOOK_TOKEN every notification is rejected with 401,
      # and Caddy refuses to start without API_HOST.
      - path: .env
        required: false
    # The image's CMD runs migrations, then uvicorn with exactly one worker.
    expose:
      - "8000"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - beacon
    environment:
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Certificates and ACME account; must persist across restarts.
  caddy_data:
  caddy_config:
