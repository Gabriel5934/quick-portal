# Build environments (sandbox and production): Beacon behind Caddy, which
# serves API_HOST over HTTPS on port 443 and redirects HTTP to HTTPS.
# Settings are hard-coded below; only CIELO_WEBHOOK_TOKEN and PORTAL_TOKEN come
# from the repository root .env.beacon (see .env.beacon.example), which is
# required.

services:
  beacon:
    build: .
    restart: unless-stopped
    env_file:
      # Required: compose (including `docker compose config`) fails when the
      # file is missing. The path is relative to this file. Beacon starts with
      # an empty CIELO_WEBHOOK_TOKEN but logs a warning and rejects every
      # notification with 401. Likewise, with an empty PORTAL_TOKEN every
      # GET /transactions request is rejected with 401.
      - path: ../.env.beacon
        required: true
    environment:
      # Relative to the container WORKDIR (/app), where ./data is bind mounted.
      DATABASE_PATH: data/beacon.sqlite3
      # 1 MiB, the code default; must match max_size in the Caddyfile.
      MAX_REQUEST_BODY_BYTES: "1048576"
      API_DOCS_ENABLED: "false"
    # The image's CMD runs migrations, then uvicorn with exactly one worker.
    # Private IP only, never 0.0.0.0: the public entry point is Caddy below,
    # which reaches beacon:8000 over the compose network.
    ports:
      - "${BEACON_PRIVATE_IP:?BEACON_PRIVATE_IP must be set}:8000:8000"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - beacon
    environment:
      # Public hostname Caddy serves over HTTPS.
      API_HOST: quick-beacon-sandbox.duckdns.org
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Certificates and ACME account; must persist across restarts.
  caddy_data:
  caddy_config:
